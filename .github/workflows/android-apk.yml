name: Android APK

# Android アプリ(android/)の APK を作る。
#   リリースを公開したとき: ArcRec-<タグ>.apk をリリースに添付する
#   手動実行・main への android/ の変更・プルリクエスト: Actions の成果物(Artifacts)に置く
# 署名鍵はリポジトリの Secrets に入れる(android/README.md の「APK の署名鍵」)。

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # aarch64 の PHP を x86_64 の上で動かして確かめるため
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Fetch static PHP (linux-aarch64)
        env:
          PHP_TARBALL_URL: ${{ vars.PHP_TARBALL_URL }}
          PHP_SHA256: ${{ vars.PHP_SHA256 }}
        run: bash android/scripts/fetch-php.sh

      - name: Check PHP (extensions, ArcRec tests, built-in server)
        run: bash android/scripts/check-php.sh

      - name: Fetch Android-native PHP (arm64)
        run: bash android/scripts/fetch-php-android.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ARCREC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/arcrec.jks"
            echo "ARCREC_KEYSTORE=$RUNNER_TEMP/arcrec.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::署名鍵(ARCREC_KEYSTORE_BASE64)が未設定のため、その場で作るデバッグ鍵で署名します。この APK は次の版に上書き更新できません(試用のみ)。"
          fi

      - name: Build APK
        working-directory: android
        env:
          ARCREC_KEYSTORE_PASSWORD: ${{ secrets.ARCREC_KEYSTORE_PASSWORD }}
          ARCREC_KEY_ALIAS: ${{ secrets.ARCREC_KEY_ALIAS }}
          ARCREC_KEY_PASSWORD: ${{ secrets.ARCREC_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Name APK
        id: apk
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            name="ArcRec-${GITHUB_REF_NAME}.apk"
          else
            ver="$(sed -n "s/.*define('LITE_VERSION', *'\([^']*\)').*/\1/p" src/bootstrap.php)"
            name="ArcRec-${ver}-$(git rev-parse --short HEAD).apk"
          fi
          cp android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.apk.outputs.name }}" --clobber
